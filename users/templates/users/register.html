<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register | FixForAll</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .register-container {
        width: 90%;
        max-width: 450px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      }

      .logo {
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        color: #007bff;
        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
        color: #333;
      }

      .form-group {
        margin-bottom: 18px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border-color: #007bff;
      }

      .register-btn {
        width: 100%;
        padding: 13px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        cursor: pointer;
      }

      .register-btn:hover {
        background: #0056b3;
      }

      .login-text {
        text-align: center;
        margin-top: 20px;
        color: #666;
      }

      .login-text a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
      }

      .error {
        background: #ffe5e5;
        color: #c00;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="register-container">
      <div class="logo">FixForAll</div>

      <p class="subtitle">
        Create your account and help improve your community.
      </p>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label>Username</label>

          <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
          />
        </div>

        <div class="form-group">
          <label>Email</label>

          <input type="email" name="email" placeholder="Enter email" required />
        </div>

        <div class="form-group">
          <label>Password</label>

          <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
          />
        </div>

        <div class="form-group">
          <label>Confirm Password</label>

          <input
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            required
          />
        </div>

        <button type="submit" class="register-btn">Create Account</button>
      </form>

      <p class="login-text">
        Already have an account?
        <a href="/login/">Login</a>
      </p>
    </div>
  </body>
</html>
