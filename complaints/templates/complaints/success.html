<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Complaint Submitted</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f7fb;
      }

      .success-container {
        width: 90%;
        max-width: 500px;
        background: white;
        padding: 45px 35px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      }

      .success-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        background: #28a745;
        color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 42px;
      }

      h1 {
        color: #222;
        margin-bottom: 15px;
        font-size: 28px;
      }

      p {
        color: #666;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .btn {
        display: inline-block;
        padding: 13px 25px;
        background: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 16px;
        transition: 0.3s;
      }

      .btn:hover {
        background: #0056b3;
      }
    </style>
  </head>

  <body>
    <div class="success-container">
      <div class="success-icon">✓</div>

      <h1>Complaint Submitted!</h1>

      <p>
        Thank you for helping us improve our community. Your complaint has been
        submitted successfully.
      </p>

      <a href="/report/" class="btn"> Report Another Issue </a>
    </div>
  </body>
</html>
