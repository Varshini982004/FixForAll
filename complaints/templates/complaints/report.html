<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Report an Issue | FixForAll</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f7fb;
        color: #222;
      }

      /* Navbar */

      .navbar {
        background: #007bff;
        color: white;

        padding: 18px 8%;

        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 25px;
        font-weight: bold;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
      }

      /* Container */

      .container {
        width: 90%;
        max-width: 650px;

        margin: 45px auto;
      }

      .form-card {
        background: white;

        padding: 35px;

        border-radius: 15px;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }

      h1 {
        text-align: center;

        color: #222;

        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;

        color: #666;

        margin-bottom: 30px;

        line-height: 1.5;
      }

      /* Form */

      label {
        display: block;

        margin-top: 18px;

        margin-bottom: 7px;

        font-weight: bold;

        color: #333;
      }

      .required {
        color: #dc3545;
      }

      input,
      textarea,
      select {
        width: 100%;

        padding: 12px;

        border: 1px solid #ccc;

        border-radius: 8px;

        font-size: 14px;

        background: white;

        outline: none;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: #007bff;

        box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.1);
      }

      textarea {
        min-height: 130px;

        resize: vertical;
      }

      input[type="file"] {
        padding: 9px;

        background: #fafafa;
      }

      .file-help {
        color: #777;

        font-size: 12px;

        margin-top: 6px;
      }

      /* Submit Button */

      button {
        width: 100%;

        margin-top: 28px;

        padding: 13px;

        background: #007bff;

        color: white;

        border: none;

        border-radius: 8px;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;
      }

      button:hover {
        background: #0056b3;

        transform: translateY(-1px);
      }

      /* Info Box */

      .info-box {
        margin-top: 22px;

        padding: 14px;

        background: #e7f1ff;

        border-left: 4px solid #007bff;

        border-radius: 6px;

        color: #084298;

        font-size: 13px;

        line-height: 1.5;
      }

      /* Mobile */

      @media (max-width: 600px) {
        .navbar {
          padding: 15px 5%;
        }

        .nav-links a {
          margin-left: 8px;

          font-size: 13px;
        }

        .container {
          width: 94%;

          margin: 25px auto;
        }

        .form-card {
          padding: 25px 20px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->

    <nav class="navbar">
      <div class="logo">FixForAll</div>

      <div class="nav-links">
        <a href="/my-reports/"> My Reports </a>
        <a href="/logout/">Logout</a>
      </div>
    </nav>

    <!-- Form -->

    <div class="container">
      <div class="form-card">
        <h1>Report an Issue</h1>

        <p class="subtitle">
          Help us improve your community by reporting a civic issue.
        </p>

        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}

          <!-- Title -->

          <label>
            Complaint Title

            <span class="required"> * </span>
          </label>

          <input
            type="text"
            name="title"
            placeholder="Example: Street light not working"
            required
          />

          <!-- Issue Type -->

          <label>
            Issue Type

            <span class="required"> * </span>
          </label>

          <select name="issue_type" required>
            <option value="">Select issue type</option>

            <option value="pothole">Pothole / Road Damage</option>

            <option value="streetlight">Broken Streetlight</option>

            <option value="garbage">Garbage / Waste</option>

            <option value="water">Water Leakage</option>

            <option value="drainage">Drainage Problem</option>

            <option value="infrastructure">
              Damaged Public Infrastructure
            </option>

            <option value="other">Other</option>
          </select>

          <!-- Location -->

          <label>
            Location

            <span class="required"> * </span>
          </label>

          <input
            type="text"
            name="location"
            placeholder="Example: Kukatpally, Hyderabad"
            required
          />

          <!-- Description -->

          <label>
            Description

            <span class="required"> * </span>
          </label>

          <textarea
            name="description"
            placeholder="Describe the problem in detail..."
            required
          ></textarea>

          <!-- Image -->

          <label> Upload Image </label>

          <input type="file" name="image" accept="image/*" />

          <p class="file-help">
            Upload a clear image of the civic issue if available.
          </p>

          <!-- Submit -->

          <button type="submit">Submit Complaint</button>
        </form>

        <div class="info-box">
          <strong>Tip:</strong>
          Provide an accurate location and a clear description so the concerned
          department can resolve the issue faster.
        </div>
      </div>
    </div>
  </body>
</html>
